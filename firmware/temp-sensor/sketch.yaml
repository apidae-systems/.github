profiles:
  apidae:
    notes: scaffolding code for temperature sensor on esp32s3
    fqbn: esp32:esp32:esp32s3
    # port: /dev/ttyACM0
    port: /dev/cu.SLAB_USBtoUART
    port_config:
      baudrate: 115200
    platforms:
      - platform: esp32:esp32 (3.3.0)
    libraries:
      - Adafruit TMP117 (1.0.3)
      - Adafruit BusIO (1.17.4)
      - Adafruit Unified Sensor (1.1.15)
    verbose: true

default_port_config:
  baudrate: 115200
default_profile: apidae
default_protocol: serial
default_port: /dev/cu.SLAB_USBtoUART
default_programmer: esptool
default_fqbn: esp32:esp32:esp32s3

# http://wiki.fluidnc.com/en/hardware/ESP32-S3_Pin_Reference

# arduino-cli lib examples

# arduino-cli board list
# arduino-cli core install esp32:esp32
# arduino-cli compile -evtu --clean
# arduino-cli monitor --log
